[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ungit-cli"
version = "0.1.0"
description = "Command line interface for Ungit"
requires-python = ">=3.10"

[project.scripts]
ungit = "ungit_cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "../core/src", "../storage/src"]
testpaths = ["tests"]
